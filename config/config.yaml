# Default configuration for LearNAT training

# Model settings
model:
  name_or_path: "Qwen/Qwen2.5-Coder-7B"
  archive: null  # Path to pre-trained checkpoint
  policy_dtype: "bfloat16"
  reference_dtype: "bfloat16"

# Dataset settings
datasets:
  - bird

data:
  train_path: "./data/sft_data.json"
  eval_path: null
  max_length: 2048

# Training settings
training:
  batch_size: 4
  eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2e-5
  dpo_learning_rate: 2e-6
  num_epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0

# Loss settings
loss:
  name: "mdpo"  # sft, dpo, ipo, mdpo
  beta: 0.2
  alpha: 0.75  # Weight for node-level similarity in margin
  label_smoothing: 0.0

# Trainer settings
trainer: "FSDPTrainer"  # BasicTrainer or FSDPTrainer
fsdp_port: null

# Logging settings
logging:
  log_every: 10
  eval_every: 100
  save_every: 500
  sample_during_eval: false

# Wandb settings
wandb:
  enabled: true
  entity: null
  project: "learnat"

# Output settings
output:
  local_dirs:
    - "./outputs"
  exp_name: "learnat_bird"

# Misc settings
seed: 42
debug: false
function: "train"  # train or eval
